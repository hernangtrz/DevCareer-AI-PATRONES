<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <!-- Marcador de dependencia UML abierta -->
    <marker id="depArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#dc2626" stroke-width="2" />
    </marker>
    <marker id="depArrowStart" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M11,1 L2,6 L11,11" fill="none" stroke="#dc2626" stroke-width="2" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1100" height="680" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Título del Diagrama -->
  <rect x="20" y="16" width="1060" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
  <text x="550" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">
    DIAGRAMA DE CLASES UML — ANTES DE APLICAR EL PATRÓN MEDIATOR
  </text>
  <text x="550" y="57" text-anchor="middle" font-size="12.5" fill="#b91c1c">
    Problema: Acoplamiento en Malla N x (N - 1) y dependencias cruzadas directas entre módulos pares (Violación de SRP y OCP)
  </text>

  <!-- ==================== ARISTAS DE ACOPLAMIENTO (MALLA ROJA) ==================== -->
  <!-- Jobs <-> Interviews -->
  <line x1="360" y1="165" x2="730" y2="165" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#depArrow)" marker-start="url(#depArrowStart)" />
  <rect x="445" y="138" width="210" height="22" rx="4" fill="#fff1f2" stroke="#fecdd3" />
  <text x="550" y="153" text-anchor="middle" font-size="11" font-weight="600" fill="#be123c">«create mock interview directo»</text>

  <!-- Jobs <-> Analytics -->
  <line x1="205" y1="245" x2="205" y2="430" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#depArrow)" marker-start="url(#depArrowStart)" />
  <rect x="85" y="325" width="240" height="22" rx="4" fill="#fff1f2" stroke="#fecdd3" />
  <text x="205" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#be123c">«registra hitos de postulación directo»</text>

  <!-- Feedback <-> Interviews -->
  <line x1="895" y1="430" x2="895" y2="245" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#depArrow)" marker-start="url(#depArrowStart)" />
  <rect x="780" y="325" width="230" height="22" rx="4" fill="#fff1f2" stroke="#fecdd3" />
  <text x="895" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#be123c">«marca finalized = true directo»</text>

  <!-- Feedback <-> Jobs (Diagonal) -->
  <line x1="730" y1="455" x2="360" y2="225" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#depArrow)" marker-start="url(#depArrowStart)" />
  <rect x="420" y="255" width="260" height="22" rx="4" fill="#fff1f2" stroke="#fecdd3" />
  <text x="550" y="270" text-anchor="middle" font-size="11" font-weight="600" fill="#be123c">«sincroniza Score y CEFR en notas directo»</text>

  <!-- Feedback <-> Analytics -->
  <line x1="730" y1="510" x2="360" y2="510" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#depArrow)" marker-start="url(#depArrowStart)" />
  <rect x="430" y="483" width="240" height="22" rx="4" fill="#fff1f2" stroke="#fecdd3" />
  <text x="550" y="498" text-anchor="middle" font-size="11" font-weight="600" fill="#be123c">«inyecta alertas de blindspots directo»</text>

  <!-- CvAndCode <-> Interviews -->
  <line x1="650" y1="355" x2="760" y2="245" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#depArrow)" />
  <!-- CvAndCode <-> Analytics -->
  <line x1="450" y1="395" x2="355" y2="455" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#depArrow)" />

  <!-- ==================== CLASE 1: JobsModule (Arriba Izquierda) ==================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="95" width="310" height="150" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <rect x="50" y="95" width="310" height="44" rx="6" fill="#1e293b" />
    <text x="205" y="113" text-anchor="middle" font-size="11" fill="#94a3b8">«Service / Controller»</text>
    <text x="205" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">JobsApplicationModule</text>
    <line x1="50" y1="175" x2="360" y2="175" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="62" y="157" font-size="12" fill="#334155" font-family="Consolas, monospace">- appRepo: IJobApplicationRepository</text>
    <text x="62" y="170" font-size="12" fill="#dc2626" font-family="Consolas, monospace">- interviewService: InterviewsModule</text>
    <text x="62" y="194" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ applyToJob(userId, job, notes): Promise</text>
    <text x="62" y="212" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ updateApplicationStatus(id, status): void</text>
    <text x="62" y="230" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ updateApplicationNotes(id, notes): void</text>
  </g>

  <!-- ==================== CLASE 2: InterviewsModule (Arriba Derecha) ==================== -->
  <g filter="url(#shadow)">
    <rect x="735" y="95" width="315" height="150" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <rect x="735" y="95" width="315" height="44" rx="6" fill="#1e293b" />
    <text x="892" y="113" text-anchor="middle" font-size="11" fill="#94a3b8">«Service / Domain»</text>
    <text x="892" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">InterviewsSessionModule</text>
    <line x1="735" y1="175" x2="1050" y2="175" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="747" y="157" font-size="12" fill="#334155" font-family="Consolas, monospace">- currentRepo: IInterviewRepository</text>
    <text x="747" y="170" font-size="12" fill="#dc2626" font-family="Consolas, monospace">- jobsService: JobsApplicationModule</text>
    <text x="747" y="194" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ createInterview(data): Promise&lt;string&gt;</text>
    <text x="747" y="212" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ editInterview(id, userId, updates): void</text>
    <text x="747" y="230" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ getInterviewById(id): Promise&lt;Interview&gt;</text>
  </g>

  <!-- ==================== CLASE 3: CvAndCodeModule (Centro) ==================== -->
  <g filter="url(#shadow)">
    <rect x="415" y="310" width="270" height="125" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <rect x="415" y="310" width="270" height="40" rx="6" fill="#334155" />
    <text x="550" y="326" text-anchor="middle" font-size="10.5" fill="#cbd5e1">«Service / Diagnostic»</text>
    <text x="550" y="342" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">CvAtsAndCodeModule</text>
    <line x1="415" y1="382" x2="685" y2="382" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="427" y="368" font-size="11.5" fill="#dc2626" font-family="Consolas, monospace">- interviewService: InterviewsModule</text>
    <text x="427" y="402" font-size="11.5" fill="#0f172a" font-family="Consolas, monospace">+ analyzeCvAts(params): Promise</text>
    <text x="427" y="420" font-size="11.5" fill="#0f172a" font-family="Consolas, monospace">+ evaluateCodeChallenge(code): Promise</text>
  </g>

  <!-- ==================== CLASE 4: AnalyticsModule (Abajo Izquierda) ==================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="435" width="310" height="150" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <rect x="50" y="435" width="310" height="44" rx="6" fill="#1e293b" />
    <text x="205" y="453" text-anchor="middle" font-size="11" fill="#94a3b8">«Service / Metrics»</text>
    <text x="205" y="471" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CandidateAnalyticsModule</text>
    <line x1="50" y1="515" x2="360" y2="515" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="62" y="497" font-size="12" fill="#dc2626" font-family="Consolas, monospace">- jobsService: JobsApplicationModule</text>
    <text x="62" y="510" font-size="12" fill="#dc2626" font-family="Consolas, monospace">- feedbackService: FeedbackModule</text>
    <text x="62" y="534" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ calculateRealUserAnalytics(userId)</text>
    <text x="62" y="552" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ computeReadinessScore(feedbacks)</text>
    <text x="62" y="570" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ extractBlindspots(feedbacks)</text>
  </g>

  <!-- ==================== CLASE 5: FeedbackEvaluationModule (Abajo Derecha) ==================== -->
  <g filter="url(#shadow)">
    <rect x="735" y="435" width="315" height="150" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <rect x="735" y="435" width="315" height="44" rx="6" fill="#1e293b" />
    <text x="892" y="453" text-anchor="middle" font-size="11" fill="#94a3b8">«Service / AI Evaluation»</text>
    <text x="892" y="471" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">FeedbackEvaluationModule</text>
    <line x1="735" y1="515" x2="1050" y2="515" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="747" y="497" font-size="12" fill="#dc2626" font-family="Consolas, monospace">- jobsService: JobsApplicationModule</text>
    <text x="747" y="510" font-size="12" fill="#dc2626" font-family="Consolas, monospace">- analyticsService: AnalyticsModule</text>
    <text x="747" y="534" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ processAndSaveEvaluation(input)</text>
    <text x="747" y="552" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ evaluateEnglishProficiency(transcript)</text>
    <text x="747" y="570" font-size="12" fill="#0f172a" font-family="Consolas, monospace">+ createFeedbackRecord(feedback)</text>
  </g>

  <!-- Pie de página / Leyenda -->
  <rect x="20" y="612" width="1060" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" />
  <line x1="45" y1="637" x2="95" y2="637" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#depArrow)" />
  <text x="110" y="641" font-size="12.5" font-weight="600" fill="#334155">
    Acoplamiento fuerte bidireccional: Cada cambio en un módulo obliga a modificar los demás módulos pares (10+ referencias cruzadas).
  </text>
</svg>

